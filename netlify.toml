[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  VITE_API_BASE_URL = "https://scam-project-backend.vercel.app"
  VITE_API_ENABLED = "true"
  VITE_API_TIMEOUT_MS = "60000"

# Keep React entry points accessible on direct navigation and refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
